name: Build and Deploy

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Build test image
        run: docker build -t myapp-test .

      - name: Run test
        run: |
          docker run -d -p 9999:80 --name test-container myapp-test
          sleep 3
          curl -f http://localhost:9999 || (docker stop test-container && docker rm test-container && exit 1)
          docker stop test-container
          docker rm test-container

  build:
    runs-on: self-hosted
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: lovesdock/myapp:latest

      - name: Deploy to Kubernetes
        run: helm upgrade --install myapp ./myapp
